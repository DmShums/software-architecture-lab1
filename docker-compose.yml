version: '3.8'

networks:
  kafka-net:
    driver: bridge

services:
  consul:
    image: consul:1.15
    networks:
      - kafka-net
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -dev -client=0.0.0.0

  zookeeper:
    image: bitnami/zookeeper:3.9.1
    networks:
      - kafka-net
    tmpfs: "/zktmp"
    environment:
      ALLOW_ANONYMOUS_LOGIN: 'yes'
    ports:
      - "2181:2181"

  kafka1:
    image: bitnami/kafka:3.7.0
    networks:
      - kafka-net
    depends_on:
      - zookeeper
      - consul
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      # two listeners: INTERNAL for inter-broker/UI, EXTERNAL for clients
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      # advertise both endpoints
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka1:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - "29092:29092"
    volumes:
      - kafka1_data:/bitnami/kafka
    command:
      - bash
      - -c
      - |
        /opt/bitnami/scripts/kafka/run.sh &
        sleep 15
        curl -X PUT http://consul:8500/v1/agent/service/register \
          -d '{"ID":"kafka1","Name":"kafka","Address":"kafka1","Port":29092}'
        wait

  kafka2:
    image: bitnami/kafka:3.7.0
    networks:
      - kafka-net
    depends_on:
      - zookeeper
      - consul
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka2:9093,EXTERNAL://localhost:29093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - "29093:29093"
    volumes:
      - kafka2_data:/bitnami/kafka
    command:
      - bash
      - -c
      - |
        /opt/bitnami/scripts/kafka/run.sh &
        sleep 15
        curl -X PUT http://consul:8500/v1/agent/service/register \
          -d '{"ID":"kafka2","Name":"kafka","Address":"kafka2","Port":29093}'
        wait

  kafka3:
    image: bitnami/kafka:3.7.0
    networks:
      - kafka-net
    depends_on:
      - zookeeper
      - consul
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:29094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka3:9094,EXTERNAL://localhost:29094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    ports:
      - "29094:29094"
    volumes:
      - kafka3_data:/bitnami/kafka
    command:
      - bash
      - -c
      - |
        /opt/bitnami/scripts/kafka/run.sh &
        sleep 15
        curl -X PUT http://consul:8500/v1/agent/service/register \
          -d '{"ID":"kafka3","Name":"kafka","Address":"kafka3","Port":29094}'
        wait

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - kafka-net
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # UI must use the INTERNAL listener ports
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9093,kafka3:9094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
